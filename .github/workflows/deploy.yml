name: Deploy

# Baut das Image, veröffentlicht es in der GitHub Container Registry und startet
# den Compose-Stack auf dem Zielserver per SSH. Staging bei jedem Push auf main,
# Produktion nur manuell (workflow_dispatch) nach Abnahme auf Staging.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "staging oder prod"
        required: true
        default: staging

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/reha

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=${IMAGE}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/reha/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Compose-Dateien auf den Server kopieren
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "apps/reha/docker/*"
          target: "/opt/reha"
          strip_components: 3
      - name: Stack aktualisieren
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/reha
            TARGET="${{ github.event.inputs.target || 'staging' }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export REHA_IMAGE="${{ needs.build.outputs.tag }}"
            docker compose -f compose.$TARGET.yml --env-file /etc/reha/$TARGET.env pull
            docker compose -f compose.$TARGET.yml --env-file /etc/reha/$TARGET.env up -d --remove-orphans
            docker image prune -f
